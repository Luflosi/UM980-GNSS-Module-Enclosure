name: "Release"
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      id-token: "write"
      contents: "write"
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@430608d219b9321ec0c98eb6c37245a39aa6756e
      - uses: cachix/cachix-action@a593539ec5b1ba1eb95f89a396efd45ca2cdaf5d
        with:
          name: luflosi
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run `nix build`
        run: nix build -L
      - name: Create release
        env:
          GH_TOKEN: ${{ github.TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          cd result/
          gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --generate-notes \
            --draft
          gh release upload "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            *
